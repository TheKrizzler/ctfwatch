[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfwatch"
version = "0.1.0"
description = "CTFWatch challenge logging client"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"