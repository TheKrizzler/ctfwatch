services:
  server:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ctfwatch:ctfwatch@postgres:5432/ctfwatch
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ctfwatch
      POSTGRES_USER: ctfwatch
      POSTGRES_PASSWORD: ctfwatch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfwatch -d ctfwatch"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: